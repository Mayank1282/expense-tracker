# Local convenience only — production runs the same Dockerfile on Render with
# MongoDB Atlas instead of the mongo service below.
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: ledger
      SESSION_DRIVER: file
      CACHE_STORE: file
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
