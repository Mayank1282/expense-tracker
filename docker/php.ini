; Production PHP settings for the container.
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; The filesystem in the image never changes at runtime, so there is nothing to
; revalidate — this buys a measurable amount on a cold Render instance.
opcache.validate_timestamps = 0

; The Atlas free tier can be slow to accept the first connection after idle.
; Failing fast here is better than holding a php-fpm worker open indefinitely.
mongodb.connect_timeout_ms = 8000
